detector:
  framework: Megvii-BaseDetection/YOLOX
  tag: 0.1.0
  commit: e1052df71842031413f6030723c3607b839c80ce
  architecture: YOLOX-M
  depth: 0.67
  width: 0.75
  num_classes: 5
  classes:
    1: pedestrian
    2: car
    3: van
    4: truck
    5: bus
dataset:
  source: VisDrone2019-MOT-train
  detector_train_manifest: data/splits/visdrone_detector_train.txt
  detector_validation_manifest: data/splits/visdrone_detector_val.txt
  train_sequences: 27
  validation_sequences: 5
  train_images: 13067
  validation_images: 2104
  train_annotations: 475877
  validation_annotations: 51776
  final_visdrone_evaluation_used_for_detector_selection: false
  uarmot_calibration_sequences_used_for_detector_selection: false
  uarmot_development_sequences_used_for_detector_selection: false
initialization:
  source: official legacy YOLOX-M COCO-pretrained checkpoint
  upstream_repository: Megvii-BaseDetection/storage
  upstream_filename: yolox_m.pth
  local_filename: yolox_m_coco_legacy_official.pth
  checkpoint_sha256: 8afe05b82e4f3f28463c3254aff79d41bf0f798a212004063373bd5997f83b70
  source_num_classes: 80
  target_num_classes: 5
  state_entries_total: 606
  state_entries_loaded: 600
  state_entries_skipped: 6
  loading_rule: load only keys whose names exist in the target model and whose tensor shapes match exactly
  skipped_keys:
  - head.cls_preds.0.weight
  - head.cls_preds.0.bias
  - head.cls_preds.1.weight
  - head.cls_preds.1.bias
  - head.cls_preds.2.weight
  - head.cls_preds.2.bias
  skipped_key_policy: retain target 5-class model initialization
training:
  input_size:
  - 640
  - 640
  test_size:
  - 640
  - 640
  max_epochs: 100
  warmup_epochs: 5
  no_aug_epochs: 15
  scheduler: yoloxwarmcos
  basic_lr_per_image: 0.00015625
  warmup_lr: 0
  min_lr_ratio: 0.05
  momentum: 0.9
  weight_decay: 0.0005
  ema: true
  batch_size: 8
  fp16: true
  workers: 2
  seed: 42
  batch_size_selection:
    criterion: GPU memory feasibility and training robustness only; not detector accuracy
    selected_before_detector_performance_evaluation: true
    selected_batch_size: 8
    hardware: NVIDIA Tesla T4, 14.563 GiB
    maximum_multiscale_input:
    - 832
    - 832
    selected_batch_probe:
      batch_size: 8
      resolution:
      - 832
      - 832
      full_training_steps: 2
      amp: true
      sgd_optimizer_step: true
      ema_update: true
      mosaic: true
      mixup: true
      simota_cpu_fallback_detected: false
      peak_allocated_gib: 5.053
      peak_reserved_gib: 5.578
      reserved_headroom_gib: 8.985
      maximum_labels_per_image_observed: 162
    boundary_probe_not_selected:
      batch_size: 16
      resolution:
      - 832
      - 832
      full_training_steps: 2
      peak_allocated_gib: 9.637
      peak_reserved_gib: 10.992
      reserved_headroom_gib: 3.571
      reserved_fraction_percent: 75.5
      maximum_labels_per_image_observed: 162
      reason_not_selected: Passed short feasibility probe but retained substantially less memory headroom
        for long stochastic Mosaic/MixUp training than batch size 8
  target_label_capacity:
    effective_max_labels: 768
    reason: Avoid silent truncation of dense VisDrone Mosaic/MixUp training targets in pinned YOLOX 0.1.0
    structural_conservative_pre_filter_bound: 735
    bound_derivation: 'maximum 147 raw eligible boxes per frame; up to four Mosaic source frames plus
      one MixUp source frame: 5*147=735'
    empirical_augmented_scan:
      resolution:
      - 832
      - 832
      batch_size: 16
      samples: 1600
      maximum_labels_per_image: 238
      samples_over_120: 154
      samples_over_150: 51
      samples_over_180: 13
      samples_over_200: 4
      samples_at_768: 0
    interpretation: Empirical scan demonstrates that the former 120-label capacity would truncate real
      augmented samples; absence of sampled outputs at 768 is not treated as a formal bound
validation:
  interval_epochs: 10
  checkpoint_selection:
    primary_metric: COCO AP@[0.50:0.95]
    direction: maximize
    dataset: detector-validation only
  test_confidence: 0.01
  nms_threshold: 0.65
leakage_control:
  detector_split_frozen_before_training: true
  detector_validation_used_only_for_detector_model_selection: true
  uarmot_calibration_used_for_detector_training: false
  uarmot_development_used_for_detector_training: false
  official_visdrone_val_used_for_detector_training: false
  official_visdrone_val_used_for_detector_selection: false
notes:
- Batch size 8 was frozen before detector-performance evaluation using GPU-memory feasibility and robustness
  evidence only; it was not selected using detector AP, tracking metrics, UAR-MOT calibration/development
  results, or final evaluation data.
- Detector validation results will not be used to alter the frozen 27/5 sequence split.
- The selected detector will generate a single cached detection set shared by ByteTrack and UAR-MOT.
